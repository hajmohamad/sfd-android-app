<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle (iOS icon shape) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Outer Ring Plate -->
  <circle cx="256" cy="265" r="150" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8" />
  <circle cx="256" cy="265" r="125" fill="#1e293b" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Cloche / Food Cover -->
  <path d="M 170 275 A 86 86 0 0 1 342 275 Z" fill="url(#gold)" filter="url(#glow)" />
  <!-- Cloche Handle -->
  <circle cx="256" cy="180" r="16" fill="url(#gold)" />
  <rect x="250" y="186" width="12" height="8" rx="3" fill="url(#gold)" />
  
  <!-- Base Serving Platter Line -->
  <rect x="150" y="278" width="212" height="14" rx="7" fill="#f8fafc" />

  <!-- Sparkles -->
  <path d="M 370 150 L 375 165 L 390 170 L 375 175 L 370 190 L 365 175 L 350 170 L 365 165 Z" fill="#67e8f9" />
  <path d="M 135 180 L 138 190 L 148 193 L 138 196 L 135 206 L 132 196 L 122 193 L 132 190 Z" fill="#67e8f9" />
</svg>
